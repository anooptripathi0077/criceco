services:
  - type: web_service
    name: secureseat-backend
    env: node
    plan: starter
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
      - key: REDIS_URL
      - key: JWT_SECRET
      - key: AI_SERVICE_URL
      - key: ALLOWED_ORIGINS
  - type: web_service
    name: secureseat-ai-service
    env: python
    plan: starter
    branch: main
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PORT
